<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS·重启计划 — 排程演示</title>
<style>
  :root{
    --bg:#09141c; --panel:#0e2030; --panel2:#122a3d; --line:#1d3a50;
    --ink:#e8f2f7; --dim:#7d97a8; --mint:#7fe3c0; --mint-d:#3fa98a;
    --amber:#e8b45a; --red:#e2705f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 700px at 82% -10%, #16384f 0%, transparent 60%),
      radial-gradient(900px 600px at -10% 110%, #10283a 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font:15px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh; padding:32px 28px 64px;
  }
  .head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .logo{width:26px;height:26px;border-radius:7px;background:var(--panel2);
    display:grid;place-items:center;border:1px solid var(--line)}
  .logo svg{width:15px;height:15px}
  h1{font-size:20px;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:13px;margin-left:40px;margin-bottom:26px}
  .wrap{display:grid;grid-template-columns:330px 1fr;gap:22px;max-width:1220px}
  .card{background:linear-gradient(180deg,rgba(18,42,61,.72),rgba(14,32,48,.9));
    border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px}
  .card h2{font-size:13px;font-weight:600;color:var(--mint);letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;align-items:center;
    padding:7px 0;border-bottom:1px dashed rgba(29,58,80,.7);font-size:13.5px}
  .row:last-child{border:0}
  .row span:first-child{color:var(--dim)}
  .num{font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--mint);margin:10px 0 4px}
  .kval{font-size:34px;font-weight:600;color:var(--mint);
    font-variant-numeric:tabular-nums;line-height:1}
  .khint{color:var(--dim);font-size:12px;margin-top:6px}
  button{width:100%;margin-top:12px;padding:11px;border-radius:9px;cursor:pointer;
    background:linear-gradient(180deg,#1b4a63,#143349);color:var(--ink);
    border:1px solid #2a5c78;font-size:13.5px;font-weight:600;letter-spacing:.02em;
    transition:.18s}
  button:hover{border-color:var(--mint);color:var(--mint)}
  button.on{background:linear-gradient(180deg,#226b56,#17513f);border-color:var(--mint-d);color:#c9f8e6}
  .bar{height:26px;border-radius:7px;background:#0a1a26;overflow:hidden;
    display:flex;border:1px solid var(--line);margin:12px 0 6px}
  .bar i{display:block;height:100%;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
  .task{padding:9px 0;border-bottom:1px solid rgba(29,58,80,.5)}
  .task:last-child{border:0}
  .tname{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
  .tmeta{color:var(--dim);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
  .blocks{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .blk{background:#17405a;border:1px solid #245b78;border-radius:5px;
    padding:2px 7px;font-size:11.5px;color:#a9d8ef;font-variant-numeric:tabular-nums}
  .drop{border-left:2px solid var(--amber);padding-left:11px;margin:11px 0}
  .drop .n{font-size:13.5px}
  .cost{color:var(--amber);font-variant-numeric:tabular-nums;font-size:12px}
  .slot{color:var(--mint);font-size:12px}
  .empty{color:var(--dim);font-size:13px;padding:10px 0}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;
    background:#22405a;color:#9dc4da;margin-left:6px}
  .warn{border-left:2px solid var(--red);padding-left:11px;margin:11px 0;font-size:13px}
  .foot{margin-top:20px;color:var(--dim);font-size:11.5px;line-height:1.9}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="head">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h11M4 12h8M4 17h7m3-3 4 3-4 3" stroke="#7fe3c0" stroke-width="2" stroke-linecap="round"/></svg></div>
  <h1>LifeOS · 重启计划</h1>
</div>
<div class="sub">排程引擎演示 — 估时校准 → 装箱 → 可放弃清单</div>

<div class="wrap">
  <div>
    <div class="card">
      <h2>个人估时系数 k</h2>
      <div class="kval" id="kval">1.00</div>
      <input type="range" id="k" min="0.8" max="2.6" step="0.05" value="1">
      <div class="khint" id="khint">尚无可用的历史记录，按原始估时计算</div>
      <button id="btnToday">模拟：今天只剩 90 分钟</button>
    </div>

    <div class="card" style="margin-top:18px">
      <h2>容量</h2>
      <div class="row"><span>今天的可用时段</span><span class="num" id="cRaw">—</span></div>
      <div class="row"><span>按 k 折算的真实可装</span><span class="num" style="color:var(--mint)" id="cCal">—</span></div>
      <div class="bar">
        <i id="barUsed" style="width:0;background:linear-gradient(90deg,#3fa98a,#7fe3c0)"></i>
        <i id="barLeft" style="width:0;background:#0f2b3d"></i>
      </div>
      <div class="bl"><span>已排 <b id="txtUsed">0</b> min</span><span>空余 <b id="txtLeft">0</b> min</span></div>
      <div class="khint" id="verdict" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="card">
    <h2>排程结果</h2>
    <div id="out"></div>
    <div class="foot">
      drop_cost = 0.55 × 紧迫度 + 0.30 × 已完成比例 + 0.15 × 不可拆性<br>
      竞品（Motion / Reclaim）在装不下时标记 unschedulable 并停留未排，等用户自己改参数；
      本引擎先按个人系数折算容量，再排序交出必须砍的项，并给出每一项的回填时段。
    </div>
  </div>
</div>

<script>
/* ---------- 引擎（与 lifeos-engine.js 同源） ---------- */
const RANK={asap:4,high:3,medium:2,low:1,none:0};
function calib(h,fb=1){const r=h.filter(x=>x.estimate>0&&x.actual>0).map(x=>x.actual/x.estimate);
  if(r.length<3)return{k:fb,n:r.length,source:'default'};
  r.sort((a,b)=>a-b);const m=r.length;
  const raw=m%2?r[(m-1)/2]:(r[m/2-1]+r[m/2])/2;
  const k=Math.max(.5,Math.min(3,raw));
  return{k:Math.round(k*1000)/1000,n:m,source:Math.abs(k-raw)<1e-9?'personal':'clamped'};}
function eff(e,k){return Math.ceil(e*k/5)*5;}
function urg(t,today){if(!t.deadline)return 0;const d=Math.round((t.deadline-today)/864e5);
  return d<0?1:1/(1+d);}
function dropCost(t,today){const u=urg(t,today),p=Math.max(0,Math.min(1,t.doneRatio||0)),
  r=t.splittable?0:1;return Math.round((.55*u+.30*p+.15*r)*10000)/10000;}
function fmt(d){const p=n=>String(n).padStart(2,'0');return `${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function mkDay(iso,win){const[a,b,c]=iso.split('-').map(Number);
  return{day:new Date(a,b-1,c),windows:win.map(w=>[w[0],w[1]])};}
function totalFree(d){return d.windows.reduce((s,w)=>s+w[1],0);}

function schedule(tasks,days,k,today,horizon){
  for(const t of tasks){t.placed=[];t.status='pending';
    if(!t.estimateMin||t.estimateMin<=0)t.status='invalid';
    else if(!t.deadline&&RANK[t.priority||'none']<=0)t.status='invalid';}
  const cand=tasks.filter(t=>t.status==='pending').sort((x,y)=>
    (x.priority==='asap'?0:1)-(y.priority==='asap'?0:1)
    ||((x.deadline?x.deadline-0:Infinity)-(y.deadline?y.deadline-0:Infinity))
    ||(RANK[y.priority||'none']-RANK[x.priority||'none']));
  const inH=d=>Math.round((d.day-today)/864e5)<=horizon;
  const capRaw=days.filter(inH).reduce((s,d)=>s+totalFree(d),0);
  const capCal=Math.floor(capRaw/k);
  for(const t of cand){
    let need=eff(t.estimateMin,k);const mc=t.minChunk||25;
    for(const d of days){
      if(!inH(d))break;
      if(t.deadline&&d.day>t.deadline)break;
      for(let i=0;i<d.windows.length;i++){
        if(need<=0)break;
        const[st,len]=d.windows[i];if(len<=0)continue;
        let take;
        if(!t.splittable){if(len<need)continue;take=need;}
        else{take=Math.min(len,need);const rest=need-take;
          if(rest>0&&rest<mc)take=(len>=need)?need:need-mc;
          if(take<=0)continue;}
        d.windows[i]=[st+take,len-take];t.placed.push({day:d.day,min:take});need-=take;
      }
      if(need<=0)break;
    }
    const tot=t.placed.reduce((s,b)=>s+b.min,0);
    if(tot===0){t.status='unschedulable';t.placed=[];}
    else if(need>0)t.status='partially';
    else t.status='scheduled';
  }
  const hard=cand.filter(t=>t.status==='unschedulable')
    .sort((a,b)=>dropCost(a,today)-dropCost(b,today))
    .map(t=>({task:t,name:t.name,cost:dropCost(t,today),reason:reason(t,today),
      slot:nextSlot(t,days,t.estimateMin||0)}));
  const part=cand.filter(t=>t.status==='partially').map(t=>{
    const pm=t.placed.reduce((s,b)=>s+b.min,0);
    return{task:t,name:t.name,placed:pm,left:eff(t.estimateMin,k)-pm,
      slot:nextSlot(t,days,eff(t.estimateMin,k)-pm)};});
  return{k,capRaw,capCal,
    scheduled:cand.filter(t=>t.placed.length).map(t=>({
      name:t.name,eff:t.placed.reduce((s,b)=>s+b.min,0),raw:t.estimateMin,
      status:t.status,blocks:t.placed.map(b=>({d:fmt(b.day),m:b.min}))})),
    dropped:hard,remainder:part,
    invalid:tasks.filter(t=>t.status==='invalid'),
    used:cand.reduce((s,t)=>s+t.placed.reduce((a,b)=>a+b.min,0),0),
    left:days.filter(inH).reduce((s,d)=>s+totalFree(d),0)};
}
function reason(t,today){const b=[];
  if(t.deadline){const d=Math.round((t.deadline-today)/864e5);b.push(d<0?'已过期':'距截止 '+d+' 天');}
  else b.push('无固定期限');
  b.push('已完成 '+Math.round((t.doneRatio||0)*100)+'%');
  b.push(t.splittable?'可拆分':'不可拆分');return b.join('；');}
function nextSlot(t,days,need){const mc=t.minChunk||25;
  for(const d of days){
    if(t.deadline&&d.day>t.deadline)return null;
    for(const[st,len]of d.windows)
      if(len>=Math.min(need||0,mc))
        return{day:fmt(d.day),start:st,fits:len>=(need||0)};}
  return null;}

/* ---------- 场景 ---------- */
const D=(y,m,d)=>new Date(y,m-1,d);
const TODAY=D(2026,11,24);
const HISTORY=[{estimate:60,actual:95},{estimate:30,actual:40},{estimate:45,actual:70},
               {estimate:20,actual:25},{estimate:90,actual:120}];

function buildTasks(){
  return [
    {name:'现代汉语章节复习',estimateMin:180,deadline:D(2026,11,30),priority:'high',splittable:true,minChunk:25},
    {name:'英语写作练习',estimateMin:90,deadline:D(2026,12,2),priority:'medium',splittable:true,minChunk:30},
    {name:'课外阅读',estimateMin:120,priority:'low',splittable:true,minChunk:20},
    {name:'小组作业汇报稿',estimateMin:45,deadline:D(2026,11,26),priority:'asap',splittable:false},
  ];
}
function buildDays(todayOnly){
  return [
    mkDay('2026-11-24',[[540,todayOnly?90:390]]),
    mkDay('2026-11-25',[[540,180]]),
    mkDay('2026-11-26',[[540,180]]),
    mkDay('2026-11-27',[[540,150]]),
    mkDay('2026-11-28',[[540,240]]),
  ];
}

/* ---------- 渲染 ---------- */
const $=id=>document.getElementById(id);
let usePersonal=true, todaySqueezed=false;

function render(){
  const k = usePersonal ? calib(HISTORY).k : parseFloat($('k').value);
  $('kval').textContent = k.toFixed(2);
  $('k').value = k;
  $('khint').textContent = usePersonal
    ? `来自 ${HISTORY.length} 条历史记录的中位数，钳制在 0.5—3.0`
    : '手动调节，用于演示不同估时偏差下的排程差异';

  const tasks = buildTasks();
  const days = buildDays(todaySqueezed);
  const r = schedule(tasks, days, k, TODAY, 0);

  $('cRaw').textContent = r.capRaw + ' min';
  $('cCal').textContent = r.capCal + ' min';
  const pct = r.capRaw ? Math.round(r.used / r.capRaw * 100) : 0;
  $('barUsed').style.width = pct + '%';
  $('barLeft').style.width = (100 - pct) + '%';
  $('txtUsed').textContent = r.used;
  $('txtLeft').textContent = r.capRaw - r.used;

  const unfit = r.dropped.length + r.remainder.length;
  $('verdict').textContent = unfit === 0
    ? '今天的任务全装得下。'
    : `${r.capRaw} 分钟按你的历史速度只等于 ${r.capCal} 分钟的活，因此有 ${unfit} 项装不下。`;

  let h = '';
  if (r.scheduled.length) {
    h += '<div style="font-size:12px;color:var(--dim);margin-bottom:8px">装得下</div>';
    for (const s of r.scheduled) {
      const tag = s.status === 'partially'
        ? '<span class="tag">部分排入</span>' : '';
      h += `<div class="task"><div class="tname"><span>${s.name}${tag}</span>
        <span class="num" style="color:var(--mint)">${s.eff} min</span></div>
        <div class="tmeta">原始估时 ${s.raw} min</div>
        <div class="blocks">${s.blocks.map(b=>`<span class="blk">${b.d} · ${b.m}min</span>`).join('')}</div></div>`;
    }
  }
  if (r.remainder.length) {
    h += '<div style="font-size:12px;color:var(--dim);margin:14px 0 8px">装了一部分，剩余另排</div>';
    for (const p of r.remainder) {
      const sl = p.slot ? `${p.slot.day} 起 ${String(Math.floor(p.slot.start/60)).padStart(2,'0')}:${String(p.slot.start%60).padStart(2,'0')}` : '本周无可行时段';
      h += `<div class="task"><div class="tname"><span>${p.name}</span>
        <span class="num" style="color:var(--amber)">剩 ${p.left} min</span></div>
        <div class="tmeta">已排 ${p.placed} min · 下一个时段 <span class="slot">${sl}</span></div></div>`;
    }
  }
  if (r.dropped.length) {
    h += '<div style="font-size:12px;color:var(--dim);margin:14px 0 6px">必须移出 — 按 drop_cost 从低到高</div>';
    for (const d of r.dropped) {
      const sl = d.slot ? `${d.slot.day} 起 ${String(Math.floor(d.slot.start/60)).padStart(2,'0')}:${String(d.slot.start%60).padStart(2,'0')}` : '本周无可行时段';
      h += `<div class="drop"><div class="n">${d.name} <span class="cost">cost ${d.cost.toFixed(4)}</span></div>
        <div class="tmeta">${d.reason}</div>
        <div class="tmeta">回填：<span class="slot">${sl}</span></div></div>`;
    }
  }
  if (r.invalid.length) {
    h += '<div style="font-size:12px;color:var(--dim);margin:14px 0 6px">前置校验拦下</div>';
    for (const i of r.invalid)
      h += `<div class="warn">${i.name} — 缺时长，不进入排程</div>`;
  }
  if (!r.scheduled.length && !r.dropped.length) h = '<div class="empty">无任务</div>';
  $('out').innerHTML = h;
}

$('k').addEventListener('input', () => { usePersonal = false; render(); });
$('btnToday').addEventListener('click', e => {
  todaySqueezed = !todaySqueezed;
  e.target.classList.toggle('on', todaySqueezed);
  e.target.textContent = todaySqueezed ? '已模拟：今天只剩 90 分钟' : '模拟：今天只剩 90 分钟';
  render();
});
render();
</script>
</body>
</html>
