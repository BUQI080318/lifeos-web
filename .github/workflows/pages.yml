name: Publish LifeOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lifeos-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: node scripts/configure.mjs
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # upload 完成后 artifact 索引有短暂延迟，deploy-pages 立刻查询会拿到
      # "Found 0 artifact(s)"。等待索引就绪再部署。
      - name: Wait for artifact index
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
