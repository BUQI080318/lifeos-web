<!doctype html>
<html lang="zh-CN" class="liquid-universe">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-lurUFaULyj4YZ70e9VdoeoFmHCITanW2jd4mNOmiUgk=' 'sha256-ucSlaLrG2xFjb+c77sBNyXg4bnfiJfQYTti7DkEc6l0=' ; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LifeOS · 重启计划</title>
<style>
:root{
  --bg:#0a0d13; --ink:#e9e7e2; --dim:#98a0ad; --line:rgba(255,255,255,.085);
  --gold:#c9a35b; --gold-soft:rgba(201,163,91,.12); --gold-line:rgba(201,163,91,.36);
  --glass:rgba(20,25,35,.58); --glass2:rgba(26,32,44,.44);
  --ok:#66a884; --warn:#cf9250; --bad:#bf6f66;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px)}
body::before{width:56vw;height:56vw;left:-14vw;top:-22vh;
  background:radial-gradient(circle,rgba(201,163,91,.28),transparent 66%);animation:drift 32s ease-in-out infinite alternate}
body::after{width:52vw;height:52vw;right:-14vw;bottom:-20vh;
  background:radial-gradient(circle,rgba(58,92,138,.28),transparent 68%);animation:drift 38s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate3d(3.5vw,3vh,0) scale(1.07)}}

header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(10,13,19,.74);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.seal{width:32px;height:32px;flex:none;color:var(--gold)}
.b-title{font-family:var(--serif);font-size:17px;letter-spacing:2px;line-height:1.25}
.b-sub{font-size:11.5px;color:var(--dim);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.hd-right{display:flex;align-items:center;gap:12px;flex:none}
.saveflag{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
select.major{appearance:none;background:var(--glass2);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:7px 28px 7px 11px;font-family:var(--sans);font-size:13px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.major:focus{outline:none;border-color:var(--gold-line)}

.shell{position:relative;z-index:1;display:grid;grid-template-columns:194px minmax(0,1fr);align-items:start}
nav{position:sticky;top:58px;padding:20px 10px 40px 24px;display:flex;flex-direction:column;gap:3px}
nav button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border:1px solid transparent;
  background:none;color:var(--dim);font-family:var(--sans);font-size:13.5px;letter-spacing:.5px;border-radius:10px;
  cursor:pointer;text-align:left;transition:color .2s,background .25s,border-color .25s}
nav button svg{width:15px;height:15px;flex:none;opacity:.7;transition:opacity .2s}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.03)}
nav button.on{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line)}
nav button.on svg{opacity:1}

main{padding:24px 28px 80px 18px;max-width:1160px;min-width:0}
.page{display:none}
.page.on{display:block;animation:rise .5s cubic-bezier(.22,.61,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1.pt{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:2px;margin:0 0 4px}
p.lead{color:var(--dim);font-size:13px;margin:0 0 20px;letter-spacing:.3px}

.card{background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:17px 19px;
  backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 34px rgba(0,0,0,.3);margin-bottom:15px}
.card.flat{background:var(--glass2);box-shadow:none}
.grid{display:grid;gap:15px;margin-bottom:15px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card{margin-bottom:0}

.lab{font-size:11.5px;color:var(--dim);letter-spacing:1.5px;margin-bottom:5px}
.big{font-family:var(--mono);font-size:32px;line-height:1.15;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big.gold{color:var(--gold)}
.big.mute{color:rgba(233,231,226,.4)}
.sub{font-size:12px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.unit{font-size:13px;color:var(--dim);margin-left:2px;font-family:var(--sans)}

h2.sec{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:1.3px;margin:0 0 13px;
  display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:13px;height:1px;background:var(--gold);flex:none}
h2.sec .r{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--dim);font-weight:400;letter-spacing:0}

.meter{margin-top:4px}
.meter-track{position:relative;height:8px;border-radius:6px;background:rgba(255,255,255,.07);margin:42px 0 32px}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;
  background:linear-gradient(90deg,rgba(201,163,91,.32),var(--gold));transition:width .6s cubic-bezier(.22,.61,.36,1)}
.mk{position:absolute;top:-6px;width:2px;height:20px;background:rgba(255,255,255,.3)}
.mk span{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;color:var(--dim);font-family:var(--mono)}
.mk.me{background:var(--gold);box-shadow:0 0 10px rgba(201,163,91,.7)}
.mk.me span{color:var(--gold);top:calc(100% + 6px);bottom:auto}

.verdict{font-size:14px;line-height:1.85}
.verdict b{color:var(--gold);font-weight:600}

ul.tips{margin:0;padding:0;list-style:none}
ul.tips li{position:relative;padding-left:16px;font-size:13px;color:rgba(233,231,226,.86);margin-bottom:9px;line-height:1.65}
ul.tips li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border:1px solid var(--gold);transform:rotate(45deg)}
ul.tips li .n{color:var(--gold);font-family:var(--mono);margin-right:5px}
ul.tips li b{color:var(--gold);font-weight:600}

.bar{position:relative;height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:linear-gradient(90deg,rgba(201,163,91,.45),var(--gold));transition:width .5s}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;font-size:11.5px;color:var(--dim);letter-spacing:1.1px;
  padding:7px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 7px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.term-h{font-family:var(--serif);font-size:13.5px;letter-spacing:1.1px;color:var(--gold);
  padding:15px 7px 5px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.term-h .r{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:0}

input.f,select.f{background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:6px 8px;font-family:var(--sans);font-size:13px;width:100%;transition:border-color .2s,background .2s}
input.f:focus,select.f:focus{outline:none;border-color:var(--gold-line);background:rgba(201,163,91,.06)}
input.f.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input.f::-webkit-outer-spin-button,input.f::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.f[type=number]{-moz-appearance:textfield;appearance:textfield}
select.f{appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.w56{width:56px}.w72{width:72px}.w92{width:92px}.w110{width:110px}

.btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.045);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-family:var(--sans);font-size:12.5px;
  letter-spacing:.5px;cursor:pointer;transition:all .22s}
.btn:hover{border-color:var(--gold-line);color:var(--gold);background:var(--gold-soft)}
.btn.gold{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}
.btn.danger:hover{border-color:rgba(191,111,102,.6);color:var(--bad);background:rgba(191,111,102,.1)}
.btn.sm{font-size:12px;padding:6px 11px}
.btn svg{width:13px;height:13px}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ico-btn{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;border-radius:6px;line-height:0;transition:color .2s,background .2s}
.ico-btn:hover{color:var(--bad);background:rgba(191,111,102,.1)}
.ico-btn svg{width:13px;height:13px}

.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.tag.ok{color:var(--ok);border-color:rgba(102,168,132,.38);background:rgba(102,168,132,.07)}
.tag.warn{color:var(--warn);border-color:rgba(207,146,80,.38);background:rgba(207,146,80,.07)}
.tag.bad{color:var(--bad);border-color:rgba(191,111,102,.38);background:rgba(191,111,102,.07)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--dim)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

.slider{width:100%;appearance:none;height:4px;border-radius:3px;background:rgba(255,255,255,.1);outline:none;margin:13px 0 3px}
.slider::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gold);
  border:2px solid #0a0d13;box-shadow:0 0 10px rgba(201,163,91,.6);cursor:pointer}
.slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid #0a0d13;cursor:pointer}
.sl-row{margin-bottom:16px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--dim)}
.sl-top b{font-family:var(--mono);font-size:15px;color:var(--gold);font-weight:400}

.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 9px;border-radius:9px;cursor:pointer;transition:background .2s}
.chk:hover{background:rgba(255,255,255,.03)}
.chk input{appearance:none;width:15px;height:15px;flex:none;margin-top:3px;border:1px solid rgba(255,255,255,.26);
  border-radius:4px;cursor:pointer;position:relative;transition:all .2s}
.chk input:checked{background:var(--gold);border-color:var(--gold)}
.chk input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #0a0d13;border-width:0 1.5px 1.5px 0;transform:rotate(40deg)}
.chk span{font-size:13px;line-height:1.55;color:rgba(233,231,226,.88)}
.chk input:checked+span{color:rgba(152,160,173,.6);text-decoration:line-through}
.chk .meta{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;text-decoration:none}
.grp-h{display:flex;align-items:center;gap:11px;margin:22px 0 8px;font-family:var(--serif);font-size:15px;letter-spacing:1.5px;color:var(--gold)}
.grp-h .bar{flex:1}
.grp-h .pct{font-family:var(--mono);font-size:12px;color:var(--dim)}

.note{font-size:12px;color:var(--dim);line-height:1.75}
.note b{color:rgba(233,231,226,.82);font-weight:400}
.src{font-size:11.5px;color:rgba(152,160,173,.72);line-height:1.9;word-break:break-all}
.src a{color:rgba(201,163,91,.82);text-decoration:none}
.src a:hover{text-decoration:underline}
.empty{color:var(--dim);font-size:12.5px;padding:8px 7px}

.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);z-index:99;
  background:rgba(20,25,35,.94);border:1px solid var(--gold-line);color:var(--ink);padding:10px 19px;
  border-radius:11px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;backdrop-filter:blur(14px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 制度页：搜索 + 手风琴 */
.rule-search{position:relative;margin-bottom:14px}
.rule-search input{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:11px 14px 11px 38px;font-family:var(--sans);font-size:13.5px;letter-spacing:.3px}
.rule-search input:focus{outline:none;border-color:var(--gold-line);background:rgba(201,163,91,.06)}
.rule-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim)}
.acc{border:1px solid var(--line);border-radius:13px;background:var(--glass);margin-bottom:9px;overflow:hidden;
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:border-color .25s}
.acc:hover{border-color:rgba(255,255,255,.14)}
.acc.on{border-color:var(--gold-line)}
.acc-head{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;user-select:none}
.acc-head .t{font-family:var(--serif);font-size:14.5px;letter-spacing:1.1px}
.acc-head .st{font-size:10.5px;color:var(--dim);font-family:var(--mono);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;letter-spacing:0;white-space:nowrap}
.acc-head .chev{margin-left:auto;width:12px;height:12px;color:var(--dim);flex:none;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.acc.on .acc-head .chev{transform:rotate(90deg);color:var(--gold)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.4,0,.2,1)}
.acc.on .acc-body{grid-template-rows:1fr}
.acc-inner{min-height:0;overflow:hidden;opacity:0;transform:translateY(-8px);transition:opacity .38s ease,transform .38s ease}
.acc.on .acc-inner{opacity:1;transform:none;transition-delay:.1s}
.acc-pad{padding:0 15px 14px}
.acc h4{font-size:12.5px;color:var(--gold);font-weight:400;margin:12px 0 4px;letter-spacing:.7px}
.acc p{font-size:12.8px;line-height:1.8;color:rgba(233,231,226,.86);margin:0 0 7px}
.acc ul{margin:0 0 7px;padding-left:0;list-style:none}
.acc ul li{position:relative;padding-left:13px;font-size:12.6px;line-height:1.75;color:rgba(233,231,226,.84);margin-bottom:4px}
.acc ul li::before{content:"";position:absolute;left:0;top:9px;width:3px;height:3px;background:var(--gold);border-radius:50%}
.acc b{color:var(--gold);font-weight:600}
.acc .warn{color:var(--bad)}
.rtable{width:100%;border-collapse:collapse;font-size:12.4px;margin:5px 0 9px}
.rtable th{font-size:10.5px;color:var(--dim);letter-spacing:.7px;padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rtable td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.rtable td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.rule-file{display:inline-flex;align-items:center;gap:5px;font-size:12.4px;color:var(--gold);text-decoration:none;
  border-bottom:1px dashed rgba(201,163,91,.38);padding-bottom:1px;margin:3px 16px 5px 0}
.rule-file:hover{border-bottom-color:var(--gold)}

/* 质感增强：卡片跟随高光 / 进度条流光 / 导航竖条 / 趋势图 */
.card{position:relative}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:radial-gradient(300px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.065),transparent 62%);
  opacity:0;transition:opacity .4s ease}
@media (hover:hover) and (pointer:fine){.card:hover::after{opacity:1}}
.bar>i{overflow:hidden}
.bar>i::after{content:"";position:absolute;top:0;bottom:0;width:60%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  animation:sweep 3.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(300%)}}
nav button{position:relative}
nav button.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:15px;border-radius:2px;background:var(--gold);box-shadow:0 0 8px rgba(201,163,91,.7)}
.trend{margin-top:4px}
.trend svg{display:block;width:100%;height:auto;overflow:visible}
.trend .dots circle{transition:r .25s ease,fill-opacity .25s ease}
.trend .dots circle:hover{r:5;fill-opacity:1}
.trend-x{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:6px}
.big[data-count]{transition:color .4s}

@media (max-width:1000px){.grid.g3,.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:780px){
  header{padding:10px 13px;gap:10px}
  .b-sub{display:none}
  .shell{grid-template-columns:1fr}
  main{padding:16px 13px 70px}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
  body::before,body::after{animation:none;filter:blur(70px);opacity:.6}
  .bar>i::after{animation:none;display:none}
  .card::after{display:none}
  nav{position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:8px 11px;gap:5px;z-index:20;
    border-bottom:1px solid var(--line);background:rgba(10,13,19,.92);backdrop-filter:blur(16px);-webkit-overflow-scrolling:touch}
  nav button{width:auto;flex:none;white-space:nowrap;padding:7px 10px;font-size:12.5px}
  nav button svg{display:none}
  nav button.on::before{left:auto;right:8px;top:auto;bottom:3px;transform:none;width:12px;height:2px}
  .big{font-size:27px}
}

/* Archive ledger: cool porcelain, ink blue, restrained vermilion */
:root{color-scheme:light;--bg:#eef2f4;--ink:#192b38;--dim:#64737d;--line:rgba(25,43,56,.15);--gold:#365a70;--gold-soft:rgba(54,90,112,.09);--gold-line:rgba(54,90,112,.27);--glass:#fbfcfc;--glass2:#e5ebee;--ok:#3c745d;--warn:#a16b35;--bad:#a3483f;--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;--sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.72;letter-spacing:0;-webkit-font-smoothing:antialiased}
body::before,body::after{display:none}
header{position:sticky;min-height:66px;background:#192f40;color:#f4f6f6;border-bottom:3px solid #b15b49;padding:12px 30px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.seal{color:#d0b383;filter:none}.b-title{font-size:15px;letter-spacing:1.1px;color:#f5f5f0}.b-sub{color:#b8c5cb}
.saveflag{color:#c3cdd1}.dot{box-shadow:none}
select.major{background-color:#243e50;color:#f5f6f4;border-color:rgba(255,255,255,.2);border-radius:3px}
