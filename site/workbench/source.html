<!doctype html>
<html lang="zh-CN" class="liquid-universe">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-B8x2yxduKyPOdHv4ws85c+G4ueAoTxv4Ka2HSGJE57c=' 'sha256-lurUFaULyj4YZ70e9VdoeoFmHCITanW2jd4mNOmiUgk=' 'sha256-2IroA6TCMg+xlR2xyqeW6ji8YN1olwEItGgNjuH/p/4=' ; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>保研台账 · 苏州大学文学院</title>
<style>
:root{
  --bg:#0a0d13; --ink:#e9e7e2; --dim:#98a0ad; --line:rgba(255,255,255,.085);
  --gold:#c9a35b; --gold-soft:rgba(201,163,91,.12); --gold-line:rgba(201,163,91,.36);
  --glass:rgba(20,25,35,.58); --glass2:rgba(26,32,44,.44);
  --ok:#66a884; --warn:#cf9250; --bad:#bf6f66;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px)}
body::before{width:56vw;height:56vw;left:-14vw;top:-22vh;
  background:radial-gradient(circle,rgba(201,163,91,.28),transparent 66%);animation:drift 32s ease-in-out infinite alternate}
body::after{width:52vw;height:52vw;right:-14vw;bottom:-20vh;
  background:radial-gradient(circle,rgba(58,92,138,.28),transparent 68%);animation:drift 38s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate3d(3.5vw,3vh,0) scale(1.07)}}

header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(10,13,19,.74);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.seal{width:32px;height:32px;flex:none;color:var(--gold)}
.b-title{font-family:var(--serif);font-size:17px;letter-spacing:2px;line-height:1.25}
.b-sub{font-size:11.5px;color:var(--dim);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.hd-right{display:flex;align-items:center;gap:12px;flex:none}
.saveflag{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
select.major{appearance:none;background:var(--glass2);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:7px 28px 7px 11px;font-family:var(--sans);font-size:13px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.major:focus{outline:none;border-color:var(--gold-line)}

.shell{position:relative;z-index:1;display:grid;grid-template-columns:194px minmax(0,1fr);align-items:start}
nav{position:sticky;top:58px;padding:20px 10px 40px 24px;display:flex;flex-direction:column;gap:3px}
nav button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border:1px solid transparent;
  background:none;color:var(--dim);font-family:var(--sans);font-size:13.5px;letter-spacing:.5px;border-radius:10px;
  cursor:pointer;text-align:left;transition:color .2s,background .25s,border-color .25s}
nav button svg{width:15px;height:15px;flex:none;opacity:.7;transition:opacity .2s}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.03)}
nav button.on{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line)}
nav button.on svg{opacity:1}

main{padding:24px 28px 80px 18px;max-width:1160px;min-width:0}
.page{display:none}
.page.on{display:block;animation:rise .5s cubic-bezier(.22,.61,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1.pt{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:2px;margin:0 0 4px}
p.lead{color:var(--dim);font-size:13px;margin:0 0 20px;letter-spacing:.3px}

.card{background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:17px 19px;
  backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 34px rgba(0,0,0,.3);margin-bottom:15px}
.card.flat{background:var(--glass2);box-shadow:none}
.grid{display:grid;gap:15px;margin-bottom:15px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card{margin-bottom:0}

.lab{font-size:11.5px;color:var(--dim);letter-spacing:1.5px;margin-bottom:5px}
.big{font-family:var(--mono);font-size:32px;line-height:1.15;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big.gold{color:var(--gold)}
.big.mute{color:rgba(233,231,226,.4)}
.sub{font-size:12px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.unit{font-size:13px;color:var(--dim);margin-left:2px;font-family:var(--sans)}

h2.sec{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:1.3px;margin:0 0 13px;
  display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:13px;height:1px;background:var(--gold);flex:none}
h2.sec .r{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--dim);font-weight:400;letter-spacing:0}

.meter{margin-top:4px}
.meter-track{position:relative;height:8px;border-radius:6px;background:rgba(255,255,255,.07);margin:42px 0 32px}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;
  background:linear-gradient(90deg,rgba(201,163,91,.32),var(--gold));transition:width .6s cubic-bezier(.22,.61,.36,1)}
.mk{position:absolute;top:-6px;width:2px;height:20px;background:rgba(255,255,255,.3)}
.mk span{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;color:var(--dim);font-family:var(--mono)}
.mk.me{background:var(--gold);box-shadow:0 0 10px rgba(201,163,91,.7)}
.mk.me span{color:var(--gold);top:calc(100% + 6px);bottom:auto}

.verdict{font-size:14px;line-height:1.85}
.verdict b{color:var(--gold);font-weight:600}

ul.tips{margin:0;padding:0;list-style:none}
ul.tips li{position:relative;padding-left:16px;font-size:13px;color:rgba(233,231,226,.86);margin-bottom:9px;line-height:1.65}
ul.tips li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border:1px solid var(--gold);transform:rotate(45deg)}
ul.tips li .n{color:var(--gold);font-family:var(--mono);margin-right:5px}
ul.tips li b{color:var(--gold);font-weight:600}

.bar{position:relative;height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:linear-gradient(90deg,rgba(201,163,91,.45),var(--gold));transition:width .5s}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;font-size:11.5px;color:var(--dim);letter-spacing:1.1px;
  padding:7px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 7px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.term-h{font-family:var(--serif);font-size:13.5px;letter-spacing:1.1px;color:var(--gold);
  padding:15px 7px 5px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.term-h .r{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:0}

input.f,select.f{background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:6px 8px;font-family:var(--sans);font-size:13px;width:100%;transition:border-color .2s,background .2s}
input.f:focus,select.f:focus{outline:none;border-color:var(--gold-line);background:rgba(201,163,91,.06)}
input.f.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input.f::-webkit-outer-spin-button,input.f::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.f[type=number]{-moz-appearance:textfield;appearance:textfield}
select.f{appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.w56{width:56px}.w72{width:72px}.w92{width:92px}.w110{width:110px}

.btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.045);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-family:var(--sans);font-size:12.5px;
  letter-spacing:.5px;cursor:pointer;transition:all .22s}
.btn:hover{border-color:var(--gold-line);color:var(--gold);background:var(--gold-soft)}
.btn.gold{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}
.btn.danger:hover{border-color:rgba(191,111,102,.6);color:var(--bad);background:rgba(191,111,102,.1)}
.btn.sm{font-size:12px;padding:6px 11px}
.btn svg{width:13px;height:13px}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ico-btn{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;border-radius:6px;line-height:0;transition:color .2s,background .2s}
.ico-btn:hover{color:var(--bad);background:rgba(191,111,102,.1)}
.ico-btn svg{width:13px;height:13px}

.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.tag.ok{color:var(--ok);border-color:rgba(102,168,132,.38);background:rgba(102,168,132,.07)}
.tag.warn{color:var(--warn);border-color:rgba(207,146,80,.38);background:rgba(207,146,80,.07)}
.tag.bad{color:var(--bad);border-color:rgba(191,111,102,.38);background:rgba(191,111,102,.07)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--dim)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

.slider{width:100%;appearance:none;height:4px;border-radius:3px;background:rgba(255,255,255,.1);outline:none;margin:13px 0 3px}
.slider::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gold);
  border:2px solid #0a0d13;box-shadow:0 0 10px rgba(201,163,91,.6);cursor:pointer}
.slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid #0a0d13;cursor:pointer}
.sl-row{margin-bottom:16px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--dim)}
.sl-top b{font-family:var(--mono);font-size:15px;color:var(--gold);font-weight:400}

.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 9px;border-radius:9px;cursor:pointer;transition:background .2s}
.chk:hover{background:rgba(255,255,255,.03)}
.chk input{appearance:none;width:15px;height:15px;flex:none;margin-top:3px;border:1px solid rgba(255,255,255,.26);
  border-radius:4px;cursor:pointer;position:relative;transition:all .2s}
.chk input:checked{background:var(--gold);border-color:var(--gold)}
.chk input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #0a0d13;border-width:0 1.5px 1.5px 0;transform:rotate(40deg)}
.chk span{font-size:13px;line-height:1.55;color:rgba(233,231,226,.88)}
.chk input:checked+span{color:rgba(152,160,173,.6);text-decoration:line-through}
.chk .meta{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;text-decoration:none}
.grp-h{display:flex;align-items:center;gap:11px;margin:22px 0 8px;font-family:var(--serif);font-size:15px;letter-spacing:1.5px;color:var(--gold)}
.grp-h .bar{flex:1}
.grp-h .pct{font-family:var(--mono);font-size:12px;color:var(--dim)}

.note{font-size:12px;color:var(--dim);line-height:1.75}
.note b{color:rgba(233,231,226,.82);font-weight:400}
.src{font-size:11.5px;color:rgba(152,160,173,.72);line-height:1.9;word-break:break-all}
.src a{color:rgba(201,163,91,.82);text-decoration:none}
.src a:hover{text-decoration:underline}
.empty{color:var(--dim);font-size:12.5px;padding:8px 7px}

.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);z-index:99;
  background:rgba(20,25,35,.94);border:1px solid var(--gold-line);color:var(--ink);padding:10px 19px;
  border-radius:11px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;backdrop-filter:blur(14px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 制度页：搜索 + 手风琴 */
.rule-search{position:relative;margin-bottom:14px}
.rule-search input{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:11px 14px 11px 38px;font-family:var(--sans);font-size:13.5px;letter-spacing:.3px}
.rule-search input:focus{outline:none;border-color:var(--gold-line);background:rgba(201,163,91,.06)}
.rule-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim)}
.acc{border:1px solid var(--line);border-radius:13px;background:var(--glass);margin-bottom:9px;overflow:hidden;
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:border-color .25s}
.acc:hover{border-color:rgba(255,255,255,.14)}
.acc.on{border-color:var(--gold-line)}
.acc-head{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;user-select:none}
.acc-head .t{font-family:var(--serif);font-size:14.5px;letter-spacing:1.1px}
.acc-head .st{font-size:10.5px;color:var(--dim);font-family:var(--mono);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;letter-spacing:0;white-space:nowrap}
.acc-head .chev{margin-left:auto;width:12px;height:12px;color:var(--dim);flex:none;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.acc.on .acc-head .chev{transform:rotate(90deg);color:var(--gold)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.4,0,.2,1)}
.acc.on .acc-body{grid-template-rows:1fr}
.acc-inner{min-height:0;overflow:hidden;opacity:0;transform:translateY(-8px);transition:opacity .38s ease,transform .38s ease}
.acc.on .acc-inner{opacity:1;transform:none;transition-delay:.1s}
.acc-pad{padding:0 15px 14px}
.acc h4{font-size:12.5px;color:var(--gold);font-weight:400;margin:12px 0 4px;letter-spacing:.7px}
.acc p{font-size:12.8px;line-height:1.8;color:rgba(233,231,226,.86);margin:0 0 7px}
.acc ul{margin:0 0 7px;padding-left:0;list-style:none}
.acc ul li{position:relative;padding-left:13px;font-size:12.6px;line-height:1.75;color:rgba(233,231,226,.84);margin-bottom:4px}
.acc ul li::before{content:"";position:absolute;left:0;top:9px;width:3px;height:3px;background:var(--gold);border-radius:50%}
.acc b{color:var(--gold);font-weight:600}
.acc .warn{color:var(--bad)}
.rtable{width:100%;border-collapse:collapse;font-size:12.4px;margin:5px 0 9px}
.rtable th{font-size:10.5px;color:var(--dim);letter-spacing:.7px;padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rtable td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.rtable td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.rule-file{display:inline-flex;align-items:center;gap:5px;font-size:12.4px;color:var(--gold);text-decoration:none;
  border-bottom:1px dashed rgba(201,163,91,.38);padding-bottom:1px;margin:3px 16px 5px 0}
.rule-file:hover{border-bottom-color:var(--gold)}

/* 质感增强：卡片跟随高光 / 进度条流光 / 导航竖条 / 趋势图 */
.card{position:relative}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:radial-gradient(300px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.065),transparent 62%);
  opacity:0;transition:opacity .4s ease}
@media (hover:hover) and (pointer:fine){.card:hover::after{opacity:1}}
.bar>i{overflow:hidden}
.bar>i::after{content:"";position:absolute;top:0;bottom:0;width:60%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  animation:sweep 3.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(300%)}}
nav button{position:relative}
nav button.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:15px;border-radius:2px;background:var(--gold);box-shadow:0 0 8px rgba(201,163,91,.7)}
.trend{margin-top:4px}
.trend svg{display:block;width:100%;height:auto;overflow:visible}
.trend .dots circle{transition:r .25s ease,fill-opacity .25s ease}
.trend .dots circle:hover{r:5;fill-opacity:1}
.trend-x{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:6px}
.big[data-count]{transition:color .4s}

@media (max-width:1000px){.grid.g3,.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:780px){
  header{padding:10px 13px;gap:10px}
  .b-sub{display:none}
  .shell{grid-template-columns:1fr}
  main{padding:16px 13px 70px}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
  body::before,body::after{animation:none;filter:blur(70px);opacity:.6}
  .bar>i::after{animation:none;display:none}
  .card::after{display:none}
  nav{position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:8px 11px;gap:5px;z-index:20;
    border-bottom:1px solid var(--line);background:rgba(10,13,19,.92);backdrop-filter:blur(16px);-webkit-overflow-scrolling:touch}
  nav button{width:auto;flex:none;white-space:nowrap;padding:7px 10px;font-size:12.5px}
  nav button svg{display:none}
  nav button.on::before{left:auto;right:8px;top:auto;bottom:3px;transform:none;width:12px;height:2px}
  .big{font-size:27px}
}

/* Archive ledger: cool porcelain, ink blue, restrained vermilion */
:root{color-scheme:light;--bg:#eef2f4;--ink:#192b38;--dim:#64737d;--line:rgba(25,43,56,.15);--gold:#365a70;--gold-soft:rgba(54,90,112,.09);--gold-line:rgba(54,90,112,.27);--glass:#fbfcfc;--glass2:#e5ebee;--ok:#3c745d;--warn:#a16b35;--bad:#a3483f;--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;--sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.72;letter-spacing:0;-webkit-font-smoothing:antialiased}
body::before,body::after{display:none}
header{position:sticky;min-height:66px;background:#192f40;color:#f4f6f6;border-bottom:3px solid #b15b49;padding:12px 30px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.seal{color:#d0b383;filter:none}.b-title{font-size:15px;letter-spacing:1.1px;color:#f5f5f0}.b-sub{color:#b8c5cb}
.saveflag{color:#c3cdd1}.dot{box-shadow:none}

<script>
"use strict";

/* ═════════════════ COMPUTE-START  ═════════════════
   纯计算层：无 DOM 依赖，可单独抽出做交叉验证。
   口径：绩点按苏大教〔2022〕67号；加分按文学院推免加分细则（2025修订）。
   ═════════════════════════════════════════════════ */

// 四舍五入，与 Python 端 math.floor(x*100+0.5)/100 完全一致
function r2(x){ return Math.floor(x * 100 + 0.5) / 100; }

// 课程学分绩点 = 4 - 3(100-X)²/1600
function gp(score){
  const x = validNumericScore(score);
  if (x === null) return null;
  if (x < 60) return 0;
  return r2(4 - 3 * Math.pow(100 - x, 2) / 1600);
}

function validCredit(value){
  if (value === "" || value === null || value === undefined || (typeof value === "string" && !value.trim())) return null;
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? n : null;
}

function validNumericScore(value){
  if (value === "" || value === null || value === undefined || (typeof value === "string" && !value.trim())) return null;
  const n = Number(value);
  return Number.isFinite(n) && n >= 0 && n <= 100 ? n : null;
}

function hasEnteredGrade(course){
  if ((course.kind || "gpa") === "grade") return ["A","B","C","D","F"].includes(String(course.score || "").toUpperCase());
  return validNumericScore(course.score) !== null;
}

// GPA：只算 kind==='gpa' 且已出分的课
function calcGpa(courses){
  let cr = 0, w = 0, filled = 0, count = 0, failed = 0;
  courses.forEach(c => {
    if ((c.kind || "gpa") !== "gpa") return;
    count++;

}

function volPts(h){

  if (h < 200) return 0;
  if (h <= 300) return 2;
  if (h <= 400) return 4;
  if (h <= 500) return 6;
  if (h <= 600) return 8;

}

  return value.filter(x=>x&&typeof x==="object"&&x.gpa!=null&&x.vol!=null&&x.extra!=null&&Number.isFinite(Number(x.gpa))&&Number(x.gpa)>=0&&Number(x.gpa)<=4&&Number.isFinite(Number(x.vol))&&Number(x.vol)>=0&&Number(x.vol)<=900&&Number.isFinite(Number(x.extra))&&Number(x.extra)>=0&&Number(x.extra)<=80).slice(0,20).map(x=>({id:String(x.id||uid()),name:String(x.name||"保存的情景"),gpa:Number(x.gpa),vol:Number(x.vol),extra:Number(x.extra),at:String(x.at||"")}));
}

let state, storageOK = true, savedAt = null;

function loadState(){
  try {
    const raw = window.LifeOSAccountStorage.getItem(KEY);
    if (!raw) { const blank=newState(); blank.courses=[]; return blank; }
    const s = JSON.parse(raw);
    const base = newState();
    return {
      v: 3,
      major: GATE[s.major] ? s.major : "师范",
      courses: Array.isArray(s.courses) ? normalizeCourses(s.courses) : base.courses,
      extras: Array.isArray(s.extras) ? s.extras.map(normalizeExtra) : [],
      extraRules: Array.isArray(s.extraRules) && s.extraRules.length ? s.extraRules : [structuredClone(EX_RULE_SEED)],
      activeExtraRuleId: s.activeExtraRuleId || EX_RULE_SEED.id,
      plan: normalizePlan(s.plan),
      study: normalizeStudy(s.study),
      policy: normalizePolicyState(s.policy),
      simScenarios: normalizeScenarios(s.simScenarios),
      lastExport: s.lastExport || null
    };
  } catch (e) { storageOK = false; return newState(); }
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const wasOK = storageOK;
    try { window.LifeOSAccountStorage.setItem(KEY, JSON.stringify(state)); savedAt = new Date(); storageOK = true; }
    catch (e) { storageOK = false; if (wasOK) toast("保存失败：浏览器暂时无法写入本机数据", "error"); }
    paintSaveFlag();
  }, 200);
  window.BaoyanSpatialExperience?.sync?.();
}
function paintSaveFlag(){
  const d = document.getElementById("dot"), t = document.getElementById("saveTxt");
  if (!storageOK) { d.classList.add("off"); t.textContent = "未保存（浏览器拦截）"; return; }
  d.classList.remove("off");
  t.textContent = savedAt ? "已保存 " + savedAt.toTimeString().slice(0, 5) : "已保存到本机";
  if (savedAt) { d.classList.remove("just-saved"); void d.offsetWidth; d.classList.add("just-saved"); setTimeout(() => d.classList.remove("just-saved"), 720); }
}
let toastTimer = null;
function toast(msg, type="success"){
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = "toast toast-" + type + " on";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), type === "error" ? 4200 : 2400);
}

/* ───────────── 组合计算 ───────────── */

function snapshot(){
  const g = calcGpa(state.courses);
  const ex = calcExtras(state.extras);
  const score = r2(g.gpa * 100 + ex.sum);
  const gate = GATE[state.major];
  return { g, ex, score, gate, gap: r2(gate - score), rank: rankOf(state.major, score) };
}

function animateOverviewNumbers(){
  const nodes = main.querySelectorAll("[data-count-to]");
  if (!nodes.length || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  nodes.forEach(node => {
    const target = Number(node.dataset.countTo), digits = Number(node.dataset.countDigits || 0);
    if (!Number.isFinite(target)) return;
    const start = performance.now(), duration = 680;
    node.textContent = (0).toFixed(digits);
    const tick = now => {
      const p = Math.min(1, (now - start) / duration), eased = 1 - Math.pow(1 - p, 3);
      node.textContent = (target * eased).toFixed(digits);
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function vOverview(s){
  const lo = 350, hi = 430;
  const pct = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const hasScore = s.g.filled > 0;
  const scorePct = pct(s.score);
  const targetPct = pct(s.gate);
  const orbitCirc = 2 * Math.PI * 84;
  const orbitOffset = orbitCirc * (1 - scorePct / 100);

  let verdict;
  if (!hasScore) {
    verdict = "还没有录入成绩。先去<b>课程成绩</b>把大一上的分数填进去，这里就会显示你离目标线还有多远。";
  } else if (s.gap <= -5) {
    verdict = "已高出目标线 <b>" + Math.abs(s.gap).toFixed(1) + " 分</b>，属于安全区。稳住，别让重点课掉下来。";
  } else if (s.gap <= 0) {
    verdict = "刚过线 <b>" + Math.abs(s.gap).toFixed(1) + " 分</b>，余量很薄。GPA 掉 0.01 就是 1 分，这学期不能有 85 分以下的重点课。";
  } else {
    verdict = "还差 <b>" + s.gap.toFixed(1) + " 分</b>。" + routeHint(s);
  }

  const volPct = Math.min(100, s.ex.hours / 601 * 100);
  const nextPts = [2,4,6,8,10].find(p => p > volPts(s.ex.hours));

  return `
  <h1 class="pt">总览</h1>
  <p class="lead">目标线 ${s.gate} 分 · ${GATE_NOTE[state.major]} · 名额 ${QUOTA[state.major]} 人</p>

  <div class="hero-cosmos card">
    <div class="cosmos-copy">
      <div class="cosmos-overline"><span class="cosmos-beacon"></span>苏州大学文学院 · 2027 推免进度</div>
      <div class="cosmos-label">${hasScore ? (s.gap > 0 ? "距离目标线还差" : "当前已超过目标线") : "等待成绩录入 · 目标线"}</div>
      <div class="cosmos-delta">${hasScore ? (s.gap > 0 ? "−" + s.gap.toFixed(1) : "+" + Math.abs(s.gap).toFixed(1)) : "目标 " + s.gate} <b>分</b></div>
      <div class="verdict">${verdict}</div>
      <div class="cosmos-stats">
        <div class="cosmos-stat"><label>累计 GPA</label><strong${hasScore ? ` data-count-to="${s.g.gpa}" data-count-digits="2"` : ""}>${hasScore ? s.g.gpa.toFixed(2) : "—"}</strong><small>${s.g.filled}/${s.g.count} 门</small></div>
        <div class="cosmos-stat"><label>发展素质 · 旧口径估算</label><strong data-count-to="${s.ex.sum}" data-count-digits="1">${s.ex.sum.toFixed(1)}</strong><small>规划参考 / 100</small></div>
        <div class="cosmos-stat"><label>名额</label><strong>${QUOTA[state.major]}</strong><small>人</small></div>
      </div>
    </div>
    <div class="orbit-stage" aria-label="综合评价与目标线示意图">
      <svg class="orbit-svg" viewBox="0 0 360 360" role="img" aria-label="综合评价 ${hasScore ? s.score.toFixed(1) : "尚未录入"} 分；目标线 ${s.gate} 分">
        <defs><linearGradient id="orbitStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#56f0d2"/><stop offset="53%" stop-color="#59d9ef"/><stop offset="100%" stop-color="#aaa4ff"/></linearGradient><radialGradient id="orbitCore"><stop stop-color="#b6fff2" stop-opacity=".12"/><stop offset="1" stop-color="#b6fff2" stop-opacity="0"/></radialGradient></defs>
        <circle cx="180" cy="180" r="118" class="orbit-outer"/><circle cx="180" cy="180" r="104" class="orbit-inner"/>
        <g class="orbit-path" transform="rotate(-29 180 180)"><ellipse cx="180" cy="180" rx="135" ry="48"/><circle class="orbit-satellite" cx="315" cy="180" r="3"/></g>
        <circle cx="180" cy="180" r="84" class="orbit-track"/>
        <circle cx="180" cy="180" r="84" class="orbit-progress" style="--orbit-offset:${orbitOffset.toFixed(2)}px"/>
        <g transform="rotate(${targetPct * 3.6} 180 180)"><line x1="180" y1="68" x2="180" y2="84" class="orbit-target"/><circle cx="180" cy="96" r="4.5" class="orbit-target-dot"/></g>
        <g transform="rotate(${scorePct * 3.6} 180 180)"><circle cx="180" cy="96" r="7" class="orbit-now-dot"/></g>
        <circle cx="180" cy="180" r="62" fill="url(#orbitCore)"/>
      </svg>
      <div class="orbit-center"><div class="orbit-score">${hasScore ? s.score.toFixed(1) : "—"}</div><div class="orbit-unit">综合评价分 · 刻度 350—430</div></div>
      <div class="orbit-legend"><span><i class="orbit-you"></i>当前分值</span><span><i class="orbit-gate"></i>目标线 ${s.gate}</span></div>
    </div>
  </div>

  <div class="grid g2">
    <div class="card">
      <h2 class="sec">志愿服务<span class="r">${s.ex.hours.toFixed(1)} / 601 小时</span></h2>
      <div class="bar"><i style="width:${volPct}%"></i></div>
      <div class="note" style="margin-top:10px">
        ${s.ex.hours < 200
          ? "现在是 0 分。不到 200 小时一分不给——这一项最容易白丢。"
          : nextPts
            ? "当前 " + volPts(s.ex.hours) + " 分。再攒 " + (hoursFor(nextPts) - s.ex.hours).toFixed(1) + " 小时升到 " + nextPts + " 分。"

      公共体育、思想政治、军事、职业生涯规划、全校性公共选修按等级记载，不计入 GPA。
      GPA 差 0.01 ＝ 综合评价差 1 分，约等于 50 小时志愿服务。
    </div>
  </div>`;
}

function routeHint(s){
  const volRoom = 10 - s.ex.vol;
  if (s.gap <= volRoom && volRoom > 0) {
    const need = Math.min(10, s.ex.vol + Math.ceil(s.gap));
    return "这一截<b>靠志愿就能补上</b>：时长从 " + s.ex.hours.toFixed(0) + " 小时攒到约 <b>" + hoursFor(need) + "</b> 小时即可。";
  }
  const afterVol = s.gap - volRoom;
  const needGpa = s.g.gpa + afterVol / 100;
  return "志愿补满也还差 <b>" + afterVol.toFixed(1) + " 分</b>，得靠成绩：GPA 要从 " +
    s.g.gpa.toFixed(2) + " 提到 <b>" + needGpa.toFixed(2) + "</b> 左右。";
}

function nextList(s){
  const out = [];
  if (s.g.filled < s.g.count) out.push('<li><span class="n">01</span>还有 <b>' + (s.g.count - s.g.filled) + "</b> 门计 GPA 课程没出分或没录，录完 GPA 才是真值。</li>");
  if (s.ex.hours < 601) {
    const nx = [2,4,6,8,10].find(p => p > volPts(s.ex.hours));
    out.push('<li><span class="n">0' + (out.length + 1) + "</span>志愿当前 " + volPts(s.ex.hours) + "/10 分" +
      (nx ? "，再攒 <b>" + (hoursFor(nx) - s.ex.hours).toFixed(0) + "</b> 小时进下一档。" : "。") + "</li>");
  }
  if (s.ex.comp === 0) out.push('<li><span class="n">0' + (out.length + 1) + "</span>竞赛还没记录：全国大学生英语竞赛每年 4 月报名，纯笔试，师范组不少人靠它拿 4–6 分。</li>");
  else if (s.ex.research === 0) out.push('<li><span class="n">0' + (out.length + 1) + "</span>科研还是空的：大二找老师进大创，校级结题约 2 分、省级 5 分、国家级 10 分。</li>");
  if (s.g.filled && s.g.gpa * 100 < s.gate) out.push('<li><span class="n">0' + (out.length + 1) + "</span>GPA 低于目标线，3 学分大课每提 1 分，比多攒 100 小时志愿更管用。</li>");
  if (!out.length) out.push("<li>各项都到位了，把力气放在保持上。</li>");
  return out.slice(0, 4).join("");
}

  return `<option value="gpa"${courseAverageScope === "gpa" ? " selected" : ""}>仅计 GPA 的百分制课程</option>
    <option value="all"${courseAverageScope === "all" ? " selected" : ""}>所有有数字成绩的课程</option>
    <optgroup label="按课程类别统计">${COURSE_CATEGORIES.map(category => `<option value="cat:${esc(category)}"${courseAverageScope === "cat:" + category ? " selected" : ""}>${esc(category)}</option>`).join("")}</optgroup>`;
}

function coursesInAverageScope(scope=courseAverageScope){
  let list = state.courses.filter(course => validNumericScore(course.score) !== null && validCredit(course.credit) !== null);
  if (scope === "gpa") list = list.filter(course => (course.kind || "gpa") === "gpa");
  else if (scope.startsWith("cat:")) list = list.filter(course => course.category === scope.slice(4));
  return list;
}

function weightedMetrics(courses){
  let credits = 0, weighted = 0;
  courses.forEach(course => {
    const credit = validCredit(course.credit), score = validNumericScore(course.score);
    if (credit === null || score === null) return;
    credits += credit; weighted += score * credit;
  });
  return {credits:r2(credits), average:credits ? r2(weighted / credits) : null, count:courses.length};
}

function targetAverage(){
  let credits = 0, weighted = 0;
  state.courses.filter(course => (course.kind || "gpa") === "gpa").forEach(course => {
    const credit = validCredit(course.credit), target = validNumericScore(course.target);
    if (credit === null || target === null) return;
    credits += credit; weighted += target * credit;
  });
  return credits ? weighted / credits : null;
}

function courseTrendMarkup(){
  const metrics = weightedMetrics(coursesInAverageScope());
  const list = coursesInAverageScope();
  const terms = TERMS.map(term => {
    const group = list.filter(course => course.term === term), stats = weightedMetrics(group);
    return stats.average === null ? null : {term, average:stats.average, credits:stats.credits, count:stats.count};
  }).filter(Boolean);
  if (!terms.length) return `<div class="course-empty-chart">录入有效的数字成绩和正数学分后，这里会显示真实的学期趋势。<br>当前统计口径：${esc(courseAverageLabel())}</div>`;
  const xs = terms.map((_, index) => terms.length === 1 ? 340 : 48 + index * (584 / (terms.length - 1)));
  const ys = terms.map(item => 174 - item.average * 1.48);
  const line = terms.map((item, index) => `${index ? "L" : "M"}${xs[index].toFixed(1)},${ys[index].toFixed(1)}`).join(" ");
  return `<svg class="course-trend" viewBox="0 0 680 220" role="img" aria-label="${esc(courseAverageLabel())}的学期加权平均成绩趋势，共 ${terms.length} 个有成绩学期">
    ${[0,50,100].map(score => {const y=174-score*1.48; return `<line class="gridline" x1="40" y1="${y}" x2="640" y2="${y}"/><text x="34" y="${y-4}" text-anchor="end">${score}</text>`;}).join("")}
    <path class="trend-line" d="${line}"/>
    ${terms.map((item,index)=>`<circle class="trend-dot" cx="${xs[index]}" cy="${ys[index]}" r="5"><title>${esc(item.term)}：${item.average.toFixed(2)} 分，${item.count} 门，${item.credits} 学分</title></circle><text x="${xs[index]}" y="202" text-anchor="middle">${esc(item.term)}</text>`).join("")}

}

function courseCategoryMarkup(){

function courseFieldError(course, field){
  const value = course[field];
  if (field === "credit") {
    if ((value === "" || value == null) && hasEnteredGrade(course)) return "已录成绩，请补充正数学分";
    if (value === "" || value == null) return "";
    return validCredit(value) === null ? "学分必须是大于 0 的有效数字" : "";
  }
  if (field === "score") {
    if (value === "" || value == null) return "";
    if ((course.kind || "gpa") === "grade") return GRADE_VALUES.includes(String(value).toUpperCase()) ? "" : "等级请使用 A、B、C、D 或 F";
    return validNumericScore(value) === null ? "成绩范围为 0–100" : "";
  }
  if (field === "target" && value !== "" && value != null && validNumericScore(value) === null) return "目标分范围为 0–100";
  return "";
}

function validateCourseRow(row, course){
  ["credit","score","target"].forEach(field => {
    const input = row.querySelector(`[data-f="${field}"]`), hint = row.querySelector(`[data-error-for="${field}"]`);
    if (!input) return;
    const message = courseFieldError(course,field);
    if (message) { input.setAttribute("aria-invalid","true"); input.title = message; }
    else { input.removeAttribute("aria-invalid"); input.removeAttribute("title"); }
    if (hint) hint.textContent = message;
    if (input.setCustomValidity) input.setCustomValidity(message);
  });
}

function applyLedgerField(input){

}

function vCalc(s){
  const g0 = s.g.filled ? s.g.gpa : 3.85;

  return `

  <div class="course-rule-note" role="note">此处沿用内置历史估算公式，不会随加分台账规则版本切换；数值和往届名次仅供情景比较，不是学校官方成绩、资格结论或实时排名。请先核验适用届别规则，再使用预计得分。</div>

  <div class="grid g2">
    <div class="card">
      <h2 class="sec">假设条件</h2>
      <div class="sl-row">
        <div class="sl-top"><span>三年加权 GPA</span><b id="lGpa">${g0.toFixed(2)}</b></div>
        <input class="slider" id="sGpa" type="range" min="0.00" max="4.00" step="0.01" value="${g0.toFixed(2)}">
      </div>
      <div class="sl-row">
        <div class="sl-top"><span>累计志愿服务时长</span><b id="lVol">${Math.round(s.ex.hours)} 小时</b></div>
        <input class="slider" id="sVol" type="range" min="0" max="900" step="10" value="${Math.round(s.ex.hours)}">
      </div>
      <div class="sl-row" style="margin-bottom:4px">
        <div class="sl-top"><span>科研 + 竞赛 + 其他</span><b id="lEx">${e0} 分</b></div>
        <input class="slider" id="sEx" type="range" min="0" max="80" step="0.5" value="${Math.min(80, e0)}">
      </div>
    </div>

    <div class="card">
      <h2 class="sec">试算结果</h2>
      <div class="kv"><span class="k">学业成绩（GPA × 100）</span><span class="v" id="rGpa">—</span></div>
      <div class="kv"><span class="k">志愿服务折算</span><span class="v" id="rVol">—</span></div>
      <div class="kv"><span class="k">其他加分</span><span class="v" id="rEx">—</span></div>
      <div class="kv"><span class="k">综合评价</span><span class="v" id="rSum" style="color:var(--gold);font-size:16px">—</span></div>
      <div class="kv"><span class="k">目标线（${state.major}）</span><span class="v">${s.gate}</span></div>
      <div class="kv"><span class="k">差距</span><span class="v" id="rGap">—</span></div>
      <div class="kv"><span class="k">往届同位</span><span class="v" id="rRank">—</span></div>
      <div class="verdict" id="rHint" style="margin-top:13px"></div>
    </div>
  </div>

  <div class="card">
    <h2 class="sec">三条固定结论</h2>
    <ul class="tips">
      <li><span class="n">01</span>综合评价 ＝ GPA × 100 ＋ 发展素质。学业占 400 分上限，是绝对大头。</li>
      <li><span class="n">02</span>GPA 差 0.01 ＝ 综合评价差 1 分 ≈ 50 小时志愿服务。三门 3 学分课各提 3 分，胜过攒 300 小时志愿。</li>
      <li><span class="n">03</span>志愿 601 小时才封顶 10 分；600 小时整只有 8 分，差 1 小时少 2 分。</li>
    </ul>
  </div>`;
}

function bindCalc(s){
  const a = document.getElementById("sGpa"), b = document.getElementById("sVol"), c = document.getElementById("sEx");
  if (!a || !b || !c) return;
  const upd = () => {
    const g = parseFloat(a.value), h = parseFloat(b.value), e = parseFloat(c.value);
    const vp = volPts(h), sum = r2(g * 100 + vp + e), gap = r2(s.gate - sum);
    document.getElementById("lGpa").textContent = g.toFixed(2);
    document.getElementById("lVol").textContent = Math.round(h) + " 小时";
    document.getElementById("lEx").textContent = e.toFixed(1) + " 分";
    document.getElementById("rGpa").textContent = (g * 100).toFixed(1);
    document.getElementById("rVol").textContent = vp + " 分";
    document.getElementById("rEx").textContent = e.toFixed(1) + " 分";
    document.getElementById("rSum").textContent = sum.toFixed(1);
    document.getElementById("rGap").innerHTML = gap > 0
      ? '<span style="color:var(--bad)">还差 ' + gap.toFixed(1) + " 分</span>"
      : '<span style="color:var(--ok)">超出 ' + Math.abs(gap).toFixed(1) + " 分</span>";
    const rk = rankOf(state.major, sum);
    document.getElementById("rRank").textContent = rk ? "第 " + rk + " 名 / " + PAST[state.major].length + " 人" : "—";
    const room = 10 - vp;
    let hint;
    if (gap <= 0) hint = "<b>达标</b>。余量 " + Math.abs(gap).toFixed(1) + " 分，按往届大约在第 " + rk + " 名。";
    else if (gap <= room) hint = "只靠志愿就够：攒到约 <b>" + hoursFor(Math.min(10, vp + Math.ceil(gap))) + " 小时</b>即可。";
    else hint = "志愿补满仍差 <b>" + (gap - room).toFixed(1) + " 分</b>，GPA 要提到 <b>" + (g + (gap - room) / 100).toFixed(2) + "</b>。";
    document.getElementById("rHint").innerHTML = hint;
  };
  [a, b, c].forEach(el => el.addEventListener("input", upd));
  upd();
}

function normalizePolicyState(value){
  const p=value&&typeof value==="object"?value:{};

  const allowed=new Set(Object.keys(POLICY_STATUS));
  const verifiedAt=p.verifiedAt&&typeof p.verifiedAt==="object"?p.verifiedAt:{};
  return {statuses:Object.fromEntries(Object.entries(statuses).filter(([id,status])=>typeof id==="string"&&allowed.has(status))),activeVersions:p.activeVersions&&typeof p.activeVersions==="object"?p.activeVersions:{},verifiedAt:Object.fromEntries(Object.entries(verifiedAt).filter(([id,date])=>typeof id==="string"&&typeof date==="string"))};
}

function policyCardMarkup(doc){

function renderPolicyArchive(){
  const query=(document.getElementById("policySearch")?.value||"").trim().toLocaleLowerCase();
  const category=document.getElementById("policyCategory")?.value||"",year=document.getElementById("policyYear")?.value||"",issuer=document.getElementById("policyIssuer")?.value||"",status=document.getElementById("policyStatus")?.value||"";
  const result=POLICY_DOCS.filter(doc=>{
    const qtext=[doc.name,doc.issuer,doc.date,doc.year,doc.version,doc.category,doc.basis,doc.clause,doc.summary,doc.school,doc.program].join(" ").toLocaleLowerCase();
    return (!query||qtext.includes(query))&&(!category||doc.category===category)&&(!year||doc.year===year)&&(!issuer||doc.issuer===issuer)&&(!status||policyStatus(doc)===status);
  });
  document.getElementById("policyGrid").innerHTML=result.map(policyCardMarkup).join("");
  document.getElementById("policyCount").textContent=`找到 ${result.length} / ${POLICY_DOCS.length} 份文件`;
  document.getElementById("policyEmpty").hidden=result.length!==0;
  document.getElementById("policyClearSearch").hidden=!query;
}

function bindPolicyArchive(){

  document.getElementById("policyClearAll").addEventListener("click",()=>{ids.forEach(id=>document.getElementById(id).value="");renderPolicyArchive();});
  const grid=document.getElementById("policyGrid");
  grid.addEventListener("click",e=>{const btn=e.target.closest("[data-policy-detail]");if(btn)openPolicyDetail(btn.dataset.policyDetail);});
  grid.addEventListener("change",e=>{
    const select=e.target.closest("[data-policy-status]");if(!select)return;
    const id=select.dataset.policyStatus,next=select.value,doc=POLICY_DOCS.find(item=>item.id===id);if(!doc)return;
    if(next==="verified"&&!confirm("请确认已打开官方原文，并核对发布信息、适用届别、关键条款及版本。仅在确已核验后标记。")){select.value=policyStatus(doc);return;}
    state.policy.statuses[id]=next;if(next==="verified")state.policy.verifiedAt[id]=new Date().toISOString().slice(0,10); save(); renderPolicyArchive();
    toast(next==="verified"?"档案状态已标记为已核验，请保留原文核对记录":"档案状态已更新");
  });

  dialog.addEventListener("cancel",()=>{document.activeElement?.blur();});

}

function bindRules(){
  document.querySelectorAll("#rules .acc-head").forEach(h => {
    h.addEventListener("click", () => {
      const open = h.parentElement.classList.toggle("on");
      h.setAttribute("aria-expanded", String(open));
    });
  });
  const archive=document.getElementById("policyArchive"), clauses=document.getElementById("policyClauses");
  document.querySelectorAll("[data-policy-tab]").forEach(btn=>btn.addEventListener("click",()=>{
    const showArchive=btn.dataset.policyTab==="archive";
    archive.classList.toggle("active",showArchive); archive.hidden=!showArchive;
    clauses.classList.toggle("active",!showArchive); clauses.hidden=showArchive;
    document.querySelectorAll("[data-policy-tab]").forEach(tab=>{const on=tab===btn;tab.classList.toggle("active",on);tab.setAttribute("aria-selected",String(on));});
  }));
  bindPolicyArchive();
  const box = document.getElementById("ruleSearch");
  if (!box) return;
  const clear = document.getElementById("ruleClear"), count = document.getElementById("ruleCount"), empty = document.getElementById("rulesEmpty");
  document.getElementById("rules").addEventListener("click", async e => {
    const button = e.target.closest("button[data-copy-rule]");
    if (!button) return;
    const rule = RULES.find(item => item.key === button.dataset.copyRule);
    if (!rule) return;
    const content = document.createElement("div"); content.innerHTML = rule.body;
    const text = `${rule.t}（${rule.st}）\n${(content.innerText || content.textContent).trim()}`;
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
      else throw new Error("clipboard unavailable");
      toast("已复制「" + rule.t + "」条款");
    } catch (_) {
      const field = document.createElement("textarea"); field.value = text; field.setAttribute("readonly", "");
      field.style.position = "fixed"; field.style.opacity = "0"; document.body.append(field); field.select();
      let copied = false; try { copied = document.execCommand("copy"); } catch (err) {}
      field.remove(); button.focus();
      toast(copied ? "已复制「" + rule.t + "」条款" : "复制失败，请手动选择条款内容", copied ? "success" : "error");
    }
  });
  const update = () => {
    const q = box.value.trim().replace(/\s+/g, "");
    let shown = 0;
    document.querySelectorAll("#rules .acc").forEach(el => {
      const wasHidden = el.style.display === "none";
      if (!q) { el.style.display = ""; if (wasHidden) animateRuleEntry(el); shown++; return; }
      const hit = el.textContent.replace(/\s+/g, "").includes(q);
      el.style.display = hit ? "" : "none";
      if (hit) { if (wasHidden) animateRuleEntry(el); shown++; el.classList.add("on"); el.querySelector(".acc-head").setAttribute("aria-expanded", "true"); }
      else el.classList.remove("filter-enter");
    });
    clear.hidden = !box.value;
    count.textContent = q ? `找到 ${shown} / ${RULES.length} 项制度` : `共 ${RULES.length} 项制度`;
    empty.hidden = shown !== 0;
  };
  box.addEventListener("input", update);
  clear.addEventListener("click", () => { box.value = ""; update(); box.focus(); });
  update();
}
function animateRuleEntry(el){
  el.classList.remove("filter-enter");
  void el.offsetWidth;
  el.classList.add("filter-enter");
  el.addEventListener("animationend", e => { if (e.animationName === "filter-rule-in") el.classList.remove("filter-enter"); }, {once:true});
}

let scrollUiFrame = 0;
function updateScrollUi(){
  if (scrollUiFrame) return;
  scrollUiFrame = requestAnimationFrame(() => {
    scrollUiFrame = 0;
    const backTop = document.getElementById("backTop");
    if (backTop) backTop.classList.toggle("visible", window.scrollY > 420);
    const progress = document.getElementById("readProgress");
    if (progress) {
      const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const value = Math.max(0, Math.min(100, Math.round(window.scrollY / max * 100)));
      progress.style.setProperty("--read", value / 100);
      progress.setAttribute("aria-valuenow", String(value));
    }
  });
}
window.addEventListener("scroll", updateScrollUi, {passive:true});
window.addEventListener("resize", updateScrollUi, {passive:true});
document.getElementById("backTop").addEventListener("click", () => window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}));

function refresh(){
  const s = snapshot();
  if (curTab === "courses") {
    const summary = main.querySelector("#courseSummary");
    if (summary) summary.outerHTML = courseSummaryMarkup(s);
    updateCourseInsights();
    const list = state.courses.filter(c => (c.kind || "gpa") === "gpa");
    main.querySelectorAll("[data-course-term]").forEach(head => {
      const t = head.dataset.courseTerm;
      const sub = list.filter(c => c.term === t);
      const st = calcGpa(sub);
      const crAll = r2(sub.reduce((n, c) => n + (validCredit(c.credit) || 0), 0));
      const el = head.querySelector("[data-course-term-summary]");
      if (el) el.textContent = `${st.filled}/${sub.length} 门有效成绩 · ${st.credits} 已录成绩学分 / ${crAll} 总学分${st.credits ? " · GPA " + st.gpa.toFixed(2) : ""}`;
    });
  }
  if (curTab === "extras") {
    const expected=extraExpectedTotals(),verified=extraVerifiedTotals(),rule=extraRule();
    EX_ORDER.forEach(cat=>{const card=main.querySelector(`[data-extra-summary="${cat}"]`);if(!card)return;const est=card.querySelector("[data-extra-est]"),ver=card.querySelector("[data-extra-ver]"),count=card.querySelector("[data-extra-count]");if(est)est.textContent="预计 "+Number(expected[cat]||0).toFixed(1);if(ver)ver.textContent="核验 "+(verified[cat]==null?"待规则核实":verified[cat].toFixed(1));if(count)count.textContent=String(state.extras.filter(e=>e.cat===cat).length);});
    const totalEst=main.querySelector("[data-extra-total-est]"),totalVer=main.querySelector("[data-extra-total-ver]"),vsum=extraVerifiedSum();if(totalEst)totalEst.textContent="预计 "+extraExpectedSum().toFixed(1);if(totalVer)totalVer.textContent="核验 "+(vsum==null?"待规则核实":vsum.toFixed(1));
    const heads = main.querySelectorAll(".term-h");
    EX_ORDER.forEach((cat, i) => {
      const el = heads[i] && heads[i].querySelector(".r");
      if (!el) return;
      const sub = state.extras.filter(x => x.cat === cat && x.ruleVersionId===rule.id);

}

function validateBackup(s){

  if (!s || typeof s !== "object" || Array.isArray(s)) return ["备份必须是 JSON 对象"];
  if(s.simScenarios!=null){
    if(!Array.isArray(s.simScenarios)||s.simScenarios.length>20)errors.push("测算情景格式无效或数量超过 20 个");
    else s.simScenarios.forEach((x,i)=>{if(!x||typeof x!=="object"||x.gpa==null||x.vol==null||x.extra==null||!Number.isFinite(Number(x.gpa))||Number(x.gpa)<0||Number(x.gpa)>4||!Number.isFinite(Number(x.vol))||Number(x.vol)<0||Number(x.vol)>900||!Number.isFinite(Number(x.extra))||Number(x.extra)<0||Number(x.extra)>80)errors.push(`第 ${i+1} 个测算情景数值无效`);});

      else Object.entries(s.policy.activeVersions||{}).forEach(([family,id])=>{if(!POLICY_DOCS.some(doc=>doc.family===family&&doc.id===id))errors.push("政策版本记录引用了不存在的版本");});
      if(s.policy.verifiedAt!=null&&(typeof s.policy.verifiedAt!=="object"||Array.isArray(s.policy.verifiedAt))) errors.push("政策核验日期格式无效");
      else Object.entries(s.policy.verifiedAt||{}).forEach(([id,date])=>{if(!POLICY_DOCS.some(doc=>doc.id===id)||typeof date!=="string")errors.push("政策核验日期包含无效档案或日期");});

    const at = `第 ${index + 1} 门课程`;
    if (!course || typeof course !== "object" || Array.isArray(course)) { errors.push(`${at}格式无效`); return; }
    if (course.term != null && !TERMS.includes(course.term)) errors.push(`${at}学期无效`);
    if (course.kind != null && !["gpa","grade"].includes(course.kind)) errors.push(`${at}计分类型无效`);
    if (course.credit !== "" && course.credit != null && validCredit(course.credit) === null) errors.push(`${at}学分必须大于 0`);
    if (course.target !== "" && course.target != null && validNumericScore(course.target) === null) errors.push(`${at}目标分需在 0–100`);
    if (course.score !== "" && course.score != null) {
      const kind = course.kind === "grade" ? "grade" : "gpa";
      if (kind === "gpa" && validNumericScore(course.score) === null) errors.push(`${at}成绩需在 0–100`);
      if (kind === "grade" && !GRADE_VALUES.includes(String(course.score).toUpperCase())) errors.push(`${at}等级需为 A、B、C、D 或 F`);
    }
    ["name","term","category","teacher","note"].forEach(field => {
      if (course[field] != null && typeof course[field] !== "string") errors.push(`${at}${field}字段格式无效`);
    });
  });
  if (s.extras != null && !Array.isArray(s.extras)) errors.push("加分记录格式无效");
  else (s.extras || []).forEach((extra,index) => {
    if (!extra || typeof extra !== "object" || Array.isArray(extra)) errors.push(`第 ${index+1} 条加分记录格式无效`);

  if(Array.isArray(s.extras)&&Array.isArray(s.extraRules)&&s.extraRules.length){const ids=new Set(s.extraRules.map(r=>r&&r.id));s.extras.forEach((e,i)=>{if(e&&e.ruleVersionId&&!ids.has(e.ruleVersionId))errors.push(`第 ${i+1} 条记录引用了不存在的规则版本`);});}
  if (s.plan != null && (typeof s.plan !== "object" || Array.isArray(s.plan))) errors.push("路线勾选数据格式无效");
  if (s.study != null && (typeof s.study !== "object" || Array.isArray(s.study))) errors.push("复习资料状态格式无效");
  else if(s.study){
    if(s.study.resources!=null&&!Array.isArray(s.study.resources))errors.push("复习资料清单必须为数组");
    else (s.study.resources||[]).forEach((resource,index)=>{
      const at=`第 ${index+1} 条复习资料`;
      if(!resource||typeof resource!=="object"||Array.isArray(resource)){errors.push(`${at}格式无效`);return;}
      if(resource.reviewStatus!=null&&!['todo','reviewing','completed'].includes(resource.reviewStatus))errors.push(`${at}复习状态无效`);
      if(resource.url&&!/^https?:\/\//i.test(resource.url))errors.push(`${at}链接必须为 HTTP(S)`);
      if(resource.reviewCount!=null&&(!Number.isInteger(Number(resource.reviewCount))||Number(resource.reviewCount)<0))errors.push(`${at}复习次数必须为非负整数`);
      if(resource.history!=null&&!Array.isArray(resource.history))errors.push(`${at}历史记录格式无效`);
      else (resource.history||[]).forEach(log=>{if(!log||typeof log!=="object"||typeof log.date!=="string"||typeof log.note!=="string")errors.push(`${at}历史记录内容无效`);});
      ["id","title","category","subject","source","fileLocation","addedAt","note","nextReview","linkedCourse","linkedTask"].forEach(field=>{if(resource[field]!=null&&typeof resource[field]!=="string")errors.push(`${at}${field}字段格式无效`);});
      if(resource.favorite!=null&&typeof resource.favorite!=="boolean")errors.push(`${at}收藏状态无效`);
    });
    const achievementCategories=['contest','research_project','paper','student_work','volunteer','other'];
    if(s.study.achievements!=null&&!Array.isArray(s.study.achievements))errors.push("个人成果档案必须为数组");
    else (s.study.achievements||[]).forEach((item,index)=>{if(!item||typeof item!=="object"||Array.isArray(item)){errors.push(`第 ${index+1} 条成果档案格式无效`);return;}if(item.category!=null&&!achievementCategories.includes(item.category))errors.push(`第 ${index+1} 条成果类别无效`);["id","title","date","detail","rank","proof","note","linkedExtraId"].forEach(field=>{if(item[field]!=null&&typeof item[field]!=="string")errors.push(`第 ${index+1} 条成果${field}字段格式无效`);});});
  }
  return errors;
}

function validateStudyArchive(archive){
  const errors=[];
  if(!archive||typeof archive!=="object"||Array.isArray(archive))return ["资料档案必须是 JSON 对象"];

function parseCsvRows(text){
  const rows=[]; let row=[], value="", quoted=false;
  text=String(text || "").replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch==='"' && text[i+1]==='"'){value+='"';i++;}
      else if(ch==='"') quoted=false;
      else value+=ch;
    }else if(ch==='"' && value==="") quoted=true;
    else if(ch===","){row.push(value);value="";}
    else if(ch==="\n" || ch==="\r"){
      if(ch==="\r"&&text[i+1]==="\n")i++;
      row.push(value);value="";
      if(row.some(cell=>cell!==""))rows.push(row);
      row=[];
    }else value+=ch;
  }
  if(quoted) throw new Error("CSV 存在未闭合的引号");
  row.push(value); if(row.some(cell=>cell!==""))rows.push(row);
  return rows;
}

function importCoursesCsv(text){
  const rows=parseCsvRows(text);
  if(!rows.length) throw new Error("CSV 没有表头");
  const headers=rows[0].map(value=>value.trim()), index=name=>headers.indexOf(name);
  const required=["学期","课程","学分","实际分","类型"];
  const missing=required.filter(name=>index(name)<0 && !(name==="类型"&&index("计分类型")>=0));
  if(missing.length) throw new Error("CSV 表头不匹配，缺少："+missing.join("、"));
  const get=(row,...names)=>{for(const name of names){const i=index(name);if(i>=0)return (row[i]||"").trim();}return "";};
  const result=[];
  rows.slice(1).forEach((row,line)=>{
    if(row.length!==headers.length) throw new Error(`第 ${line+2} 行列数与表头不一致`);
    const term=get(row,"学期"), name=get(row,"课程"), rawKind=get(row,"计分类型","类型"),
          kind=["计GPA","gpa","GPA"].includes(rawKind)?"gpa":(["等级课","grade","等级"].includes(rawKind)?"grade":null),
          rawCredit=get(row,"学分"), rawScore=get(row,"实际分"), rawTarget=get(row,"目标分");
    if(!TERMS.includes(term)) throw new Error(`第 ${line+2} 行学期无效`);
    if(!kind) throw new Error(`第 ${line+2} 行课程类型无效`);
    const credit=rawCredit===""?"":Number(rawCredit);
    if(rawCredit!==""&&(!Number.isFinite(credit)||credit<=0)) throw new Error(`第 ${line+2} 行学分必须大于 0`);
    let score="";
    if(rawScore!==""){
      if(kind==="gpa") {score=Number(rawScore);if(validNumericScore(score)===null)throw new Error(`第 ${line+2} 行成绩需在 0–100`);}
      else {score=rawScore.toUpperCase();if(!GRADE_VALUES.includes(score))throw new Error(`第 ${line+2} 行等级无效`);}
    }
    let target="";
    if(rawTarget!==""){target=Number(rawTarget);if(validNumericScore(target)===null)throw new Error(`第 ${line+2} 行目标分需在 0–100`);}
    const rawCategory=get(row,"课程类别","类别"), category=COURSE_CATEGORIES.includes(rawCategory)?rawCategory:"未分类";
    result.push(normalizeCourse({id:uid(),term,kind,category,name,credit,teacher:get(row,"任课"),target,score,note:get(row,"备注")}));
  });
  return result;
}

      if(!revealObserver||card.getBoundingClientRect().top<window.innerHeight*.9)card.classList.add("is-visible");
      else{card.classList.remove("is-visible");revealObserver.observe(card);}
    });
  }
  bindScrollReveals();
  new MutationObserver(()=>requestAnimationFrame(bindScrollReveals)).observe(revealRoot,{childList:true});
})();
</script>
